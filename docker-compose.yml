# ============================================================
# Cookie Pool — Selenium Grid + noVNC 人工登录账号池
# ============================================================
# 启动:  cp .env.example .env  →  编辑 .env  →  docker compose up -d
# 停止:  docker compose down
# 日志:  docker compose logs -f

services:
  # ── FastAPI 后端 + React SPA (多阶段构建) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cp-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - GRID_URL=http://grid:4444
      - DATA_DIR=/data
      - API_KEY=${API_KEY:-change-me}
      - HOST_ADDRESS=${HOST_ADDRESS:-127.0.0.1}
      - NOVNC_PORT=${NOVNC_PORT:-7901}
    volumes:
      - ${DATA_DIR:-./data}:/data
    depends_on:
      grid:
        condition: service_started
    restart: unless-stopped
    networks:
      - cp-network

  # ── Selenium Standalone Grid (hub + node + Chrome 合一) ──
  grid:
    image: ${GRID_IMAGE:-selenium/standalone-chromium:latest}
    container_name: cp-grid
    shm_size: "2gb"
    environment:
      - SE_NODE_MAX_SESSIONS=${GRID_MAX_SESSIONS:-1}
      - SE_NODE_SESSION_TIMEOUT=${GRID_SESSION_TIMEOUT:-300}
      - SE_START_XVFB=true
      - SE_START_VNC=true
      - SE_START_NO_VNC=true
      - SE_VNC_PASSWORD=${VNC_PASSWORD:-}
    volumes:
      - ${DATA_DIR:-./data}/profiles:/data/profiles
    ports:
      - "${NOVNC_PORT:-7901}:7900"
    restart: unless-stopped
    networks:
      - cp-network

networks:
  cp-network:
    driver: bridge