services:
  # FastAPI 后端 + React SPA (多阶段构建)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cp-app
    ports:
      - "8080:8080"
    environment:
      - GRID_URL=http://selenium-hub:4444
      - DATA_DIR=/data
      - API_KEY=***
      - HOST_ADDRESS=158.180.87.150
      - NOVNC_PORT=7901
    volumes:
      - ./data:/data
    depends_on:
      selenium-hub:
        condition: service_started
    restart: unless-stopped
    networks:
      - cp-network

  # Selenium Grid Router/Hub
  selenium-hub:
    image: seleniarm/hub:latest
    container_name: cp-hub
    environment:
      - SE_SESSION_REQUEST_TIMEOUT=300
      - SE_REJECT_UNSUPPORTED_CAPABILITIES=false
    # 不暴露端口到宿主机，仅内部网络访问
    restart: unless-stopped
    networks:
      - cp-network

  # Chrome Node（可 scale 扩展）
  chrome:
    image: seleniarm/node-chromium:latest
    container_name: cp-chrome
    shm_size: "2gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_VNC_VIEW_ONLY=0
      - SE_START_XVFB=true
      - SE_START_VNC=true
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_OPTS=--override-max-sessions true
      - SE_NODE_PORT=5555
    volumes:
      - ./data/profiles:/data/profiles
    ports:
      - "7901:7900"  # 宿主机 7901 → 容器 noVNC 7900
    restart: unless-stopped
    networks:
      - cp-network

networks:
  cp-network:
    driver: bridge